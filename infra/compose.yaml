# Production stack, deployed by Komodo on the home server (EU), see
# 00-docs/40-operations/deployment-komodo.md and ADR 0019.
#
# - Komodo writes the stack environment to `.env` next to this file (run directory `infra`)
#   and passes it with `--env-file`. Template with every variable: infra/compose.env.example.
# - Images come from GHCR with a fixed tag (IMAGE_TAG = `sha-<commit>` or a SemVer version).
# - `migrate` runs Alembic once before api, worker and mcp start (expand/contract only).
# - Only Caddy publishes ports (80/443). Grafana listens on localhost for SSH tunnels.
name: stadtfest

x-app-env-file: &app-env-file
  env_file:
    - path: ${STADTFEST_ENV_FILE:-.env}
      required: true

# Values derived from the stack (internal hostnames); everything else comes from the env file.
x-app-environment: &app-environment
  ENV: prod
  LOG_FORMAT: json
  DATABASE_URL: postgresql+asyncpg://stadtfest:${POSTGRES_PASSWORD:?}@postgres:5432/stadtfest
  REDIS_URL: redis://redis:6379/0
  GEOCODING_PROVIDER: nominatim
  NOMINATIM_URL: http://nominatim:8080
  WEB_SEARCH_BASE_URL: ${WEB_SEARCH_BASE_URL:-http://searxng:8080}
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_PRESIGN_ENDPOINT_URL: https://${IMAGES_HOST:?}
  S3_PUBLIC_BASE_URL: https://${IMAGES_HOST:?}/${S3_BUCKET:-stadtfest-images}
  MCP_PUBLIC_URL: https://${MCP_HOST_NAME:?}
  DEEP_LINK_BASE_URL: https://${LINK_HOST:?}

x-app: &app
  <<: *app-env-file
  image: ghcr.io/${GHCR_OWNER:-harpune}/stadtfest-backend:${IMAGE_TAG:?set IMAGE_TAG to sha-<commit> or a version}
  restart: unless-stopped
  volumes:
    # APNs key and FCM service account for PUSH_PROVIDER=direct (readable by uid 10001).
    - ${SECRETS_DIR:-/etc/stadtfest/secrets}/push:/run/secrets/push:ro
  logging: &logging
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

x-app-depends: &app-depends
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # One-shot Alembic job; api, worker and mcp only start after it exited with 0.
  migrate:
    <<: *app
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  api:
    <<: *app
    environment:
      <<: *app-environment
      # Caddy is the only client; trust its X-Forwarded-For for the hashed rate-limit key.
      FORWARDED_ALLOW_IPS: "*"
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/v1/health/live', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    environment: *app-environment
    command: ["python", "-m", "stadtfest.bootstrap.worker"]
    depends_on: *app-depends
    healthcheck:
      # arq writes a health key every 60 s; `--check` fails when it is missing.
      test: ["CMD", "python", "-m", "stadtfest.bootstrap.worker", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  mcp:
    <<: *app
    image: ghcr.io/${GHCR_OWNER:-harpune}/stadtfest-mcp:${IMAGE_TAG:?}
    environment:
      <<: *app-environment
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8001"
      FORWARDED_ALLOW_IPS: "*"
    depends_on: *app-depends
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  postgres:
    # Multi-arch PostGIS build, same as infra/compose.dev.yaml and the tests.
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: stadtfest
      POSTGRES_USER: stadtfest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stadtfest -d stadtfest"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    # Append-only file: queued jobs (e.g. IdP deletion retries) survive a restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  # Self-hosted geocoding for Germany (ADR 0006); the first import takes several hours.
  nominatim:
    image: mediagis/nominatim:5.1
    restart: unless-stopped
    environment:
      PBF_URL: https://download.geofabrik.de/europe/germany-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/europe/germany-updates/
      IMPORT_STYLE: address
      UPDATE_MODE: continuous
      NOMINATIM_PASSWORD: ${NOMINATIM_DB_PASSWORD:?}
    volumes:
      - nominatim-data:/var/lib/postgresql/16/main
    shm_size: 2gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/status >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      # The initial import of Germany runs before the HTTP server starts.
      start_period: 12h
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 12g
    logging: *logging

  # Web search tool of the AI search (ADR 0013), internal only.
  searxng:
    image: docker.io/searxng/searxng:2026.10.2-19ffbcd30
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?}
    volumes:
      - ./prod/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  # S3-compatible object storage for event images (ADR 0007, 0019).
  seaweedfs:
    image: chrislusf/seaweedfs:4.00
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs-data:/data
      # Identities incl. the backend key; template: infra/prod/seaweedfs/s3.example.json.
      - ${SECRETS_DIR:-/etc/stadtfest/secrets}/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  # Reverse proxy with automatic TLS: API, MCP, public images and the deep-link site.
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?}
      LINK_HOST: ${LINK_HOST:?}
      API_HOST: ${API_HOST:?}
      MCP_HOST_NAME: ${MCP_HOST_NAME:?}
      IMAGES_HOST: ${IMAGES_HOST:?}
      S3_BUCKET: ${S3_BUCKET:-stadtfest-images}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      IMPRINT_NAME: ${IMPRINT_NAME:?}
      IMPRINT_ADDRESS: ${IMPRINT_ADDRESS:?}
      IMPRINT_EMAIL: ${IMPRINT_EMAIL:?}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deeplinks/public:/srv/deeplinks:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    logging: *logging

  # Daily encrypted backups (PostgreSQL dump + object storage) with restic (ADR 0021).
  backup:
    image: ghcr.io/${GHCR_OWNER:-harpune}/stadtfest-backup:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: stadtfest
      PGUSER: stadtfest
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_WITHIN: ${BACKUP_KEEP_WITHIN:-30d}
      TZ: Europe/Berlin
      # Image bucket, read through the S3 API with the backend identity (rclone remote `objects`).
      S3_BUCKET: ${S3_BUCKET:-stadtfest-images}
      RCLONE_CONFIG_OBJECTS_TYPE: s3
      RCLONE_CONFIG_OBJECTS_PROVIDER: SeaweedFS
      RCLONE_CONFIG_OBJECTS_ENDPOINT: http://seaweedfs:8333
      RCLONE_CONFIG_OBJECTS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      RCLONE_CONFIG_OBJECTS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
    volumes:
      - backup-cache:/cache
      # SSH key and known_hosts for the Hetzner Storage Box (sftp).
      - ${SECRETS_DIR:-/etc/stadtfest/secrets}/backup-ssh:/home/backup/.ssh:ro
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    logging: *logging

  # --- Observability (ADR 0020) ----------------------------------------------------
  loki:
    image: grafana/loki:3.7.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    # The Loki image has no shell or HTTP client for a healthcheck; Grafana shows its state.
    deploy:
      resources:
        limits:
          memory: 1g
    logging: *logging

  alloy:
    image: grafana/alloy:v1.16.0
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      # Only containers of this compose project are collected.
      COMPOSE_PROJECT: ${COMPOSE_PROJECT_NAME:-stadtfest}
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only access to discover containers and read their logs (TOMs).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345 && printf \"GET /-/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200\" <&3'"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
    logging: *logging

  grafana:
    image: grafana/grafana:12.4.0
    restart: unless-stopped
    ports:
      # Not public: reach it via `ssh -L 3000:127.0.0.1:3000 <server>` (monitoring.md).
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  nominatim-data:
  seaweedfs-data:
  caddy-data:
  caddy-config:
  backup-cache:
  loki-data:
  alloy-data:
  grafana-data:
