# Only main builds images (CLAUDE.md): push to GHCR tagged with commit SHA (+ SemVer on tags).
name: Release images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

jobs:
  backend-image:
    name: Build and push ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # API, worker and the migration job share one image; the MCP server has its own
          # (R15-US4). The HomeLab stack `stadtfest` pins all four to the same SemVer tag
          # (ADR 0019); Renovate there proposes the bump after a `vX.Y.Z` tag.
          - image: stadtfest-backend
            context: backend
            target: api
          - image: stadtfest-mcp
            context: backend
            target: mcp
          # Host-based routing and the deep-link site behind the HomeLab Caddy.
          - image: stadtfest-edge
            context: infra/edge
            target: ""
          # SearXNG with the settings of the AI search (ADR 0013).
          - image: stadtfest-searxng
            context: infra/searxng
            target: ""
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=main,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
