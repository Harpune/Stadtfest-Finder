# Login (R05): guest → heart → guest hint → login via Keycloak (hosted login in the browser
# sheet) → back in the app, pending favorite executed → drawer shows the name → logout.
# Requires the local stack (`make dev`, `make seed`) with Keycloak and the dev realm.
appId: de.stadtfestfinder.app
name: Anmelden und Abmelden
env:
  EVENT: 24b84e9c-31ad-5e4a-83fa-799fd1273ed7 # "Reichsstädter Tage"
  USERNAME: nutzer@example.test # dev realm test user (infra/dev/keycloak)
  PASSWORD: stadtfest-dev
---
- setLocation:
    latitude: 48.8375
    longitude: 10.0933
- runFlow:
    file: shared/launch.yaml
    env:
      LOCATION: inuse
- extendedWaitUntil:
    visible:
      id: discover.carousel.card.${EVENT}
    timeout: 30000
- tapOn:
    id: discover.carousel.card.${EVENT}
- extendedWaitUntil:
    visible:
      id: detail.title
    timeout: 10000

# Heart as guest → hint → entry screen
- tapOn:
    id: detail.favorite
- assertVisible: 'Lieblingsfeste merken'
- tapOn:
    id: guestHint.login
- extendedWaitUntil:
    visible:
      id: login.title
    timeout: 5000
- tapOn:
    id: login.email

# iOS asks before opening the auth session ("… möchte zum Anmelden … verwenden").
- runFlow:
    when:
      visible: 'Fortfahren|Continue'
    commands:
      - tapOn: 'Fortfahren|Continue'

# Keycloak hosted login
- extendedWaitUntil:
    visible:
      id: username
    timeout: 20000
- tapOn:
    id: username
- inputText: ${USERNAME}
- tapOn:
    id: password
- inputText: ${PASSWORD}
- tapOn:
    id: kc-login

# Back in the app: pending favorite executed (favorites follow in R06)
- extendedWaitUntil:
    visible: 'Angemeldet · Fest gemerkt'
    timeout: 20000
- tapOn:
    id: detail.back

# Drawer shows the name; logout returns to guest mode
- tapOn:
    id: discover.profile
- extendedWaitUntil:
    visible:
      id: drawer.name
    timeout: 10000
- assertVisible: 'Lena Beispiel'
- assertVisible: 'nutzer@example.test'
- tapOn:
    id: drawer.logout
- extendedWaitUntil:
    visible: 'Du bist abgemeldet'
    timeout: 10000
- tapOn:
    id: discover.profile
- assertVisible:
    id: drawer.login
