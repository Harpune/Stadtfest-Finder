openapi: 3.1.0
info:
  title: Stadtfest-Finder API
  version: 0.1.0
  summary: REST API for the Stadtfest-Finder mobile app.
  description: |
    Single source of truth for the REST interface (API-first, see CLAUDE.md).
    Times are ISO 8601; "today" is evaluated in Europe/Berlin. Coordinates are WGS84.
    Public endpoints work without a token; protected ones require a JWT issued by the IdP.
  contact:
    name: Stadtfest-Finder
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: events
    description: Public event catalog (flow A, guest search). Works without a token.
  - name: categories
    description: Public list of active categories (filter chips, marker colors).
  - name: geocoding
    description: Place/ZIP search and reverse geocoding via self-hosted Nominatim (ADR 0006).
paths:
  /v1/health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Liveness probe
      description: Returns 200 as long as the process is able to serve requests.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        default:
          $ref: "#/components/responses/Error"
  /v1/health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe
      description: Checks the dependencies required to serve traffic (database, Redis).
      security: []
      responses:
        "200":
          description: All dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        default:
          $ref: "#/components/responses/Error"
  /v1/categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Active categories
      description: |
        Active categories in moderation order (`sortOrder`). Cacheable: the response carries
        an `ETag`; `If-None-Match` with the current ETag yields `304`.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: ETag of a previously received response.
          schema:
            type: string
      responses:
        "200":
          description: Active categories, sorted.
          headers:
            ETag:
              description: Version of the category list.
              schema:
                type: string
            Cache-Control:
              description: Client caching policy.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "304":
          description: Not modified (ETag matches).
        default:
          $ref: "#/components/responses/Error"
  /v1/events:
    get:
      operationId: searchEvents
      tags: [events]
      summary: Search events for map and list
      description: |
        Published or cancelled events that have not ended yet (end date >= today, Europe/Berlin).
        Sorted: running first, then by start date ascending, then by name.
        `lat`/`lon` define the reference point for `distanceKm` and, together with `radiusKm`,
        a radius filter. Without `lat`/`lon` the distance refers to the center of `bbox`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
        - $ref: "#/components/parameters/RadiusKm"
        - $ref: "#/components/parameters/When"
        - $ref: "#/components/parameters/Months"
        - $ref: "#/components/parameters/Categories"
        - $ref: "#/components/parameters/Query"
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from `nextCursor` of the previous page.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Page size (the map requests up to 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/events/count:
    get:
      operationId: countEvents
      tags: [events]
      summary: Count matching events
      description: |
        Number of events matching the same filters as `searchEvents`, used for the filter
        button and the chip counts. `byCategory` counts, per category, the events that match
        all filters except the category filter.
      security: []
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
        - $ref: "#/components/parameters/RadiusKm"
        - $ref: "#/components/parameters/When"
        - $ref: "#/components/parameters/Months"
        - $ref: "#/components/parameters/Categories"
        - $ref: "#/components/parameters/Query"
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCount"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/events/{eventId}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Event detail
      description: |
        Full details of a published or cancelled event. Past events remain available by ID
        (timeline, lists). Drafts and deleted events yield `404`.
      security: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: Event ID.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
      responses:
        "200":
          description: Event detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/geocode:
    get:
      operationId: geocode
      tags: [geocoding]
      summary: Search places and ZIP codes in Germany
      description: |
        Suggestions for a city name, ZIP code or address (Germany only). A 5-digit input is
        treated as a ZIP code. Rate-limited per client.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search text (city, ZIP code or address).
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - name: limit
          in: query
          required: false
          description: Maximum number of suggestions.
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Suggestions, best match first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeocodeResult"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/geocode/reverse:
    get:
      operationId: reverseGeocode
      tags: [geocoding]
      summary: Place for coordinates
      description: Resolves coordinates to ZIP code and place. Coordinates are never stored.
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude (WGS84).
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          description: Longitude (WGS84).
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: The place at the coordinates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseGeocodeResult"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    Bbox:
      name: bbox
      in: query
      required: false
      description: Map viewport `minLon,minLat,maxLon,maxLat`.
      style: form
      explode: false
      schema:
        type: array
        minItems: 4
        maxItems: 4
        items:
          type: number
    Lat:
      name: lat
      in: query
      required: false
      description: Latitude of the reference point (user position or map center). Requires `lon`.
      schema:
        type: number
        minimum: -90
        maximum: 90
    Lon:
      name: lon
      in: query
      required: false
      description: Longitude of the reference point. Requires `lat`.
      schema:
        type: number
        minimum: -180
        maximum: 180
    RadiusKm:
      name: radiusKm
      in: query
      required: false
      description: Radius around `lat`/`lon` in km. Ignored without `lat`/`lon`.
      schema:
        type: integer
        minimum: 10
        maximum: 300
        default: 150
    When:
      name: when
      in: query
      required: false
      description: |
        Time filter: `today` = running today; `weekend` = overlaps Saturday or Sunday of the
        current week; `months` = overlaps at least one month in `months`.
      schema:
        type: string
        enum: [all, today, weekend, months]
        default: all
    Months:
      name: months
      in: query
      required: false
      description: Months `YYYY-MM` (required for `when=months`, at most 12).
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 12
        items:
          type: string
          pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
    Categories:
      name: categories
      in: query
      required: false
      description: Category IDs. Unknown or inactive IDs are ignored silently.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          format: uuid
    Query:
      name: q
      in: query
      required: false
      description: Text search in name, place and city (case/accent-insensitive, typo-tolerant).
      schema:
        type: string
        minLength: 2
        maxLength: 100
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the IdP (Zitadel in production, Keycloak locally).
  responses:
    Error:
      description: Error in the common error format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Category:
      type: object
      description: Event category (filter chip, marker border color).
      required: [id, name, emoji, color, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Stadtfest]
        emoji:
          type: string
          examples: ["🎪"]
        color:
          type: string
          pattern: "^#[0-9A-F]{6}$"
          examples: ["#FFB547"]
        sortOrder:
          type: integer
          minimum: 0
    CategoryRef:
      type: object
      description: Category as embedded in an event detail.
      required: [id, name, emoji, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emoji:
          type: string
        color:
          type: string
          pattern: "^#[0-9A-F]{6}$"
    PublicEventStatus:
      type: string
      description: Status of a publicly visible event. "Past" is derived from `endDate`.
      enum: [published, cancelled]
    Image:
      type: object
      description: Event image variants (R08).
      required: [url, thumbUrl]
      properties:
        url:
          type: string
          format: uri
        thumbUrl:
          type: string
          format: uri
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    EventSummary:
      type: object
      description: Event as shown in carousel, list and timeline.
      required: [id, name, shortName, status, startDate, endDate, place, city, lat, lon, categoryId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: string
          description: Short name for the selected map pin.
        status:
          $ref: "#/components/schemas/PublicEventStatus"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        place:
          type: string
        city:
          type: string
        lat:
          type: number
        lon:
          type: number
        categoryId:
          type: string
          format: uuid
        distanceKm:
          type: ["number", "null"]
          description: Distance to the reference point, if one was given.
        coverImage:
          oneOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"
    EventPage:
      type: object
      description: One page of events.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        nextCursor:
          type: ["string", "null"]
          description: Cursor for the next page, `null` on the last page.
    EventCount:
      type: object
      description: Result counts for filter previews.
      required: [total, byCategory]
      properties:
        total:
          type: integer
          minimum: 0
        byCategory:
          type: object
          description: Category ID -> number of events matching all filters except categories.
          additionalProperties:
            type: integer
            minimum: 0
    ProgramItem:
      type: object
      description: Entry of the event program.
      required: [date, timeLabel, title]
      properties:
        date:
          type: string
          format: date
        timeLabel:
          type: string
          examples: ["10:45 Uhr"]
        title:
          type: string
        subtitle:
          type: ["string", "null"]
    EventDetail:
      type: object
      description: Full public event detail.
      required:
        [id, name, shortName, status, category, startDate, endDate, openingHours, place, address,
         city, postalCode, lat, lon, program, images]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: string
        status:
          $ref: "#/components/schemas/PublicEventStatus"
        cancelReason:
          type: ["string", "null"]
        category:
          $ref: "#/components/schemas/CategoryRef"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        openingHours:
          type: array
          items:
            type: string
        price:
          type: ["string", "null"]
        place:
          type: string
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
        lat:
          type: number
        lon:
          type: number
        description:
          type: ["string", "null"]
        program:
          type: array
          items:
            $ref: "#/components/schemas/ProgramItem"
        transit:
          type: ["string", "null"]
        parking:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
          format: uri
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        distanceKm:
          type: ["number", "null"]
    GeocodeResult:
      type: object
      description: A geocoding suggestion.
      required: [label, city, lat, lon, kind]
      properties:
        label:
          type: string
          examples: ["73430 Aalen"]
        postalCode:
          type: ["string", "null"]
          pattern: "^[0-9]{5}$"
        city:
          type: string
        lat:
          type: number
        lon:
          type: number
        kind:
          type: string
          enum: [postcode, city, address]
    ReverseGeocodeResult:
      type: object
      description: Place for coordinates.
      required: [city, label]
      properties:
        postalCode:
          type: ["string", "null"]
          pattern: "^[0-9]{5}$"
        city:
          type: string
        label:
          type: string
    Error:
      type: object
      description: Common error format for all non-2xx responses.
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code, e.g. `validation_failed`, `not_found`.
          examples: [validation_failed]
        message:
          type: string
          description: Human-readable message (German, suitable for display).
          examples: [Bitte fülle die markierten Pflichtfelder aus]
        fields:
          type: object
          description: Field-level errors keyed by field name.
          additionalProperties:
            type: string
    HealthStatus:
      type: object
      description: Result of the liveness probe.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessStatus:
      type: object
      description: Result of the readiness probe with one entry per dependency.
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          description: Status per dependency, e.g. `database`, `redis`.
          additionalProperties:
            type: string
            enum: [ok, unavailable]
security:
  - bearerAuth: []
