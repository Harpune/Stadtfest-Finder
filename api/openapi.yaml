openapi: 3.1.0
info:
  title: Stadtfest-Finder API
  version: 0.1.0
  summary: REST API for the Stadtfest-Finder mobile app.
  description: |
    Single source of truth for the REST interface (API-first, see CLAUDE.md).
    Times are ISO 8601; "today" is evaluated in Europe/Berlin. Coordinates are WGS84.
    Public endpoints work without a token; protected ones require a JWT issued by the IdP.
  contact:
    name: Stadtfest-Finder
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes.
  - name: events
    description: Public event catalog (flow A, guest search). Works without a token.
  - name: categories
    description: Public list of active categories (filter chips, marker colors).
  - name: geocoding
    description: Place/ZIP search and reverse geocoding via self-hosted Nominatim (ADR 0006).
  - name: favorites
    description: |
      Favorites of the signed-in user (R06, context `collections`). The same list feeds the
      timeline in the profile drawer and the hearts on map, list and detail.
  - name: moderation
    description: |
      Event maintenance for moderators (R07, context `moderation`). Requires the role
      `moderator`, which covers all events; there are no regions (ADR 0015). Changes are
      written together with a domain event (transactional outbox, ADR 0005). Categories
      (R09) are app-wide: `moderator` reads, `category_admin` writes.
  - name: account
    description: |
      Profile of the signed-in user (flow B). The user is created on the first call; the
      email address is never stored (E-08), the app reads it from the ID token.
  - name: notifications
    description: |
      Notification list, settings and push devices of the signed-in user (R11, context
      `notifications`). Texts are rendered when reading (E-09); push payloads carry IDs and
      generic texts only (E-04).
  - name: friends
    description: |
      Friendships via a personal friend link or QR code (R12, context `collections`, E-02).
      The link itself is the owner's consent; there are no requests to decline and no user
      search.
  - name: lists
    description: |
      Shared event lists with friends (R13, context `collections`). Only members see a list
      (others get `404`); all members have the same rights.
  - name: invitations
    description: |
      Invitations to an event (R14, context `collections`): one invitation per host and event
      with any number of friends. The message is user free text, visible only to host and
      invitees, never logged.
  - name: config
    description: Public app configuration.
paths:
  /v1/health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Liveness probe
      description: Returns 200 as long as the process is able to serve requests.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        default:
          $ref: "#/components/responses/Error"
  /v1/health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe
      description: Checks the dependencies required to serve traffic (database, Redis).
      security: []
      responses:
        "200":
          description: All dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        "503":
          description: At least one dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"
        default:
          $ref: "#/components/responses/Error"
  /v1/categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Active categories
      description: |
        Active categories in moderation order (`sortOrder`). Cacheable: the response carries
        an `ETag`; `If-None-Match` with the current ETag yields `304`.
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: ETag of a previously received response.
          schema:
            type: string
      responses:
        "200":
          description: Active categories, sorted.
          headers:
            ETag:
              description: Version of the category list.
              schema:
                type: string
            Cache-Control:
              description: Client caching policy.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "304":
          description: Not modified (ETag matches).
        default:
          $ref: "#/components/responses/Error"
  /v1/events:
    get:
      operationId: searchEvents
      tags: [events]
      summary: Search events for map and list
      description: |
        Published or cancelled events that have not ended yet (end date >= today, Europe/Berlin).
        Sorted: running first, then by start date ascending, then by name.
        `lat`/`lon` define the reference point for `distanceKm` and, together with `radiusKm`,
        a radius filter. Without `lat`/`lon` the distance refers to the center of `bbox`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
        - $ref: "#/components/parameters/RadiusKm"
        - $ref: "#/components/parameters/When"
        - $ref: "#/components/parameters/Months"
        - $ref: "#/components/parameters/Categories"
        - $ref: "#/components/parameters/Query"
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque cursor from `nextCursor` of the previous page. Cursors not issued by the
            server are rejected with `422`.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Page size (the map requests up to 500).
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/events/count:
    get:
      operationId: countEvents
      tags: [events]
      summary: Count matching events
      description: |
        Number of events matching the same filters as `searchEvents`, used for the filter
        button and the chip counts. `byCategory` counts, per category, the events that match
        all filters except the category filter.
      security: []
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
        - $ref: "#/components/parameters/RadiusKm"
        - $ref: "#/components/parameters/When"
        - $ref: "#/components/parameters/Months"
        - $ref: "#/components/parameters/Categories"
        - $ref: "#/components/parameters/Query"
      responses:
        "200":
          description: Counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCount"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/events/{eventId}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Event detail
      description: |
        Full details of a published or cancelled event. Past events remain available by ID
        (timeline, lists). Drafts and deleted events yield `404`. With a token the response
        additionally contains `isFavorite`; such responses are never cached.
      security: []
      parameters:
        - name: eventId
          in: path
          required: true
          description: Event ID.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lon"
      responses:
        "200":
          description: Event detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/geocode:
    get:
      operationId: geocode
      tags: [geocoding]
      summary: Search places and ZIP codes in Germany
      description: |
        Suggestions for a city name, ZIP code or address (Germany only). A 5-digit input is
        treated as a ZIP code. Rate-limited per client.
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search text (city, ZIP code or address).
          schema:
            type: string
            minLength: 2
            maxLength: 120
        - name: limit
          in: query
          required: false
          description: Maximum number of suggestions.
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        "200":
          description: Suggestions, best match first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeocodeResult"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/geocode/reverse:
    get:
      operationId: reverseGeocode
      tags: [geocoding]
      summary: Place for coordinates
      description: Resolves coordinates to ZIP code and place. Coordinates are never stored.
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude (WGS84).
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          description: Longitude (WGS84).
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: The place at the coordinates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseGeocodeResult"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/config:
    get:
      operationId: getConfig
      tags: [config]
      summary: Public app configuration
      description: |
        Settings the app needs before sign-in, e.g. which push token type to register
        (`expo`: Expo push token, `direct`: native APNs/FCM token, `disabled`: none).
      security: []
      responses:
        "200":
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
        default:
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      operationId: getMe
      tags: [account]
      summary: Own profile
      description: |
        Profile of the caller. Creates the user on the first call (upsert on the token
        subject); first and last name are taken from the claims `given_name` / `family_name`.
        Roles come from the token.
      responses:
        "200":
          description: Profile of the signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      tags: [account]
      summary: Change own name
      description: Sets first and last name (each 1-50 characters after trimming).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMe
      tags: [account]
      summary: Delete own account
      description: |
        Deletes all personal data of the caller (Art. 17 GDPR) and the account at the IdP.
        If the IdP is unavailable, its deletion is retried in the background.
      responses:
        "204":
          description: Account deleted.
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      summary: Own favorites
      description: |
        Favorites of the caller, ordered by start date. Deleted and unpublished events are
        left out; cancelled ones keep their status. Past events (end date before today) are
        only included with `include=past`.
      parameters:
        - name: include
          in: query
          required: false
          description: "`past` also returns favorites whose event has ended."
          schema:
            type: string
            enum: [past]
      responses:
        "200":
          description: Favorites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteList"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/favorites/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        description: Event ID.
        schema:
          type: string
          format: uuid
    put:
      operationId: addFavorite
      tags: [favorites]
      summary: Mark an event as favorite
      description: |
        Idempotent. Only publicly visible events (published or cancelled, also past ones);
        otherwise `404`.
      responses:
        "204":
          description: The event is a favorite.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Remove an event from the favorites
      description: Idempotent; succeeds also if the event was no favorite or no longer exists.
      responses:
        "204":
          description: The event is no favorite.
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: Own notifications
      description: |
        Newest first. The text is rendered from the type and the referenced data (E-09);
        entries whose event was deleted are left out. The header `X-Unread-Count` carries
        the number of unread entries (badge on the avatar and in the drawer).
      parameters:
        - name: cursor
          in: query
          required: false
          description: >-
            Opaque cursor from `nextCursor` of the previous page. Cursors not issued by the
            server are rejected with `422`.
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: One page of notifications.
          headers:
            X-Unread-Count:
              description: Number of unread notifications of the caller.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/notifications/{notificationId}/read:
    parameters:
      - name: notificationId
        in: path
        required: true
        description: Notification ID.
        schema:
          type: string
          format: uuid
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      description: Idempotent. Notifications of other users are `404`.
      responses:
        "204":
          description: The notification is read.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        description: Notification ID.
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteNotification
      tags: [notifications]
      summary: Delete a notification
      description: |
        Removes the entry from the caller's list (swipe in the app). Idempotent: also `204`
        if it no longer exists; notifications of other users are left alone.
      responses:
        "204":
          description: The notification is gone.
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      description: The unread count drops to zero.
      responses:
        "204":
          description: All notifications are read.
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/notification-settings:
    get:
      operationId: getNotificationSettings
      tags: [notifications]
      summary: Own notification settings
      description: Defaults until the first change (all types on, 1 day before, 25 km, no home).
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: updateNotificationSettings
      tags: [notifications]
      summary: Replace own notification settings
      description: |
        Replaces the whole object. The home is given as ZIP code and place name; the server
        stores the ZIP code center from geocoding, never a GPS position (E-10). An unknown
        ZIP code is `422` (`postal_code_unknown`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettingsUpdate"
      responses:
        "200":
          description: The stored settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/devices:
    post:
      operationId: registerDevice
      tags: [notifications]
      summary: Register a push token
      description: |
        Called after the notification permission and after every sign-in. Idempotent; a
        token registered by another user moves to the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
      responses:
        "204":
          description: The device is registered.
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/devices/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: The push token (URL-encoded).
        schema:
          type: string
          minLength: 1
          maxLength: 4096
    delete:
      operationId: removeDevice
      tags: [notifications]
      summary: Remove a push token
      description: Called on sign-out. Idempotent; tokens of other users are left alone.
      responses:
        "204":
          description: The token is no longer registered for the caller.
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/friend-link:
    get:
      operationId: getFriendLink
      tags: [friends]
      summary: Own friend link
      description: |
        The caller's personal friend link token; created on the first call. The app builds the
        URL `https://{link host}/freund/{token}` and the QR code from it.
      responses:
        "200":
          description: The friend link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendLink"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/friend-link/rotate:
    post:
      operationId: rotateFriendLink
      tags: [friends]
      summary: Reset the friend link
      description: Creates a new token; the old one stops working immediately.
      responses:
        "200":
          description: The new friend link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendLink"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/friend-links/{token}:
    parameters:
      - $ref: "#/components/parameters/FriendToken"
    get:
      operationId: getFriendLinkOwner
      tags: [friends]
      summary: Who shared a friend link
      description: |
        First name and last-name initial of the link owner, only for signed-in users.
        At most 20 lookups and accepts per user and hour (`429`), against guessing tokens.
      responses:
        "200":
          description: The owner of the link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendLinkOwner"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/friend-links/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/FriendToken"
    post:
      operationId: acceptFriendLink
      tags: [friends]
      summary: Become friends via a link
      description: |
        Creates the friendship in both directions and notifies the link owner
        (`friend_added`). Idempotent if the friendship exists. The own link is `422 self_link`;
        unknown or reset tokens are `404`. Counts towards the lookup limit (`429`).
      responses:
        "201":
          description: The new (or existing) friend.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Friend"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: Own friends
      description: Ordered by first and last name.
      responses:
        "200":
          description: The friends.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendList"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/friends/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: User ID of the friend.
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeFriend
      tags: [friends]
      summary: Remove a friend
      description: |
        Ends the friendship in both directions, without a notification. Idempotent. Shared
        lists and invitations stay.
      responses:
        "204":
          description: The friendship is gone.
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/lists:
    get:
      operationId: listSharedLists
      tags: [lists]
      summary: Own shared lists
      description: Lists the caller is a member of, ordered by the next upcoming event, then name.
      responses:
        "200":
          description: The lists.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SharedListSummary"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSharedList
      tags: [lists]
      summary: Create a shared list
      description: |
        The caller becomes a member; `memberIds` must be friends of the caller
        (`422 not_a_friend`). New members get `list_added`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedListCreate"
      responses:
        "201":
          description: The new list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedList"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/lists/{listId}:
    parameters:
      - $ref: "#/components/parameters/ListId"
    get:
      operationId: getSharedList
      tags: [lists]
      summary: A shared list
      description: Members and events (chronological, incl. past and cancelled). Non-members get `404`.
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedList"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: renameSharedList
      tags: [lists]
      summary: Rename a shared list
      description: Any member may rename (1-60 characters after trimming).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedListRename"
      responses:
        "200":
          description: The renamed list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedList"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteSharedList
      tags: [lists]
      summary: Delete a shared list
      description: Any member may delete the list for everyone.
      responses:
        "204":
          description: The list is gone.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/lists/{listId}/members:
    parameters:
      - $ref: "#/components/parameters/ListId"
    post:
      operationId: addSharedListMember
      tags: [lists]
      summary: Add a member
      description: |
        Only friends of the caller (`422 not_a_friend`). Idempotent; a new member gets
        `list_added`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedListMemberAdd"
      responses:
        "204":
          description: The user is a member.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/lists/{listId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/ListId"
      - name: userId
        in: path
        required: true
        description: User ID of the member; the caller's own ID leaves the list.
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeSharedListMember
      tags: [lists]
      summary: Remove a member or leave
      description: |
        Removes another member, or with the caller's own ID leaves the list. When the last
        member leaves, the list is deleted. Idempotent.
      responses:
        "204":
          description: The user is no member.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/lists/{listId}/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/ListId"
      - name: eventId
        in: path
        required: true
        description: Event ID.
        schema:
          type: string
          format: uuid
    put:
      operationId: addSharedListEvent
      tags: [lists]
      summary: Add an event
      description: Only publicly visible events (otherwise `404`). Idempotent.
      responses:
        "204":
          description: The event is in the list.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: removeSharedListEvent
      tags: [lists]
      summary: Remove an event
      description: Idempotent.
      responses:
        "204":
          description: The event is not in the list.
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/events/{eventId}/invitation:
    parameters:
      - name: eventId
        in: path
        required: true
        description: Event ID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getHostInvitation
      tags: [invitations]
      summary: Own invitation to an event
      description: The caller's invitation as host with all invitees, or `404` if there is none yet.
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostInvitation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/events/{eventId}/invitation/invitees:
    parameters:
      - name: eventId
        in: path
        required: true
        description: Event ID.
        schema:
          type: string
          format: uuid
    post:
      operationId: inviteFriends
      tags: [invitations]
      summary: Invite friends
      description: |
        Creates the caller's invitation if needed (one per host and event) and adds friends
        (`422 not_a_friend`); already invited users are ignored. `message` replaces the old
        message only if set. Past and cancelled events are `422 event_not_invitable`. Every
        new invitee gets `invite`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostInvitation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/events/{eventId}/invitation/link:
    parameters:
      - name: eventId
        in: path
        required: true
        description: Event ID.
        schema:
          type: string
          format: uuid
    post:
      operationId: createInvitationLink
      tags: [invitations]
      summary: Invitation link for friends without the app
      description: |
        Creates the invitation if needed and returns its link token (one per invitation). The
        app builds the URL `https://{link host}/e/{token}`.
      responses:
        "200":
          description: The link token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationLink"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/invitations/{invitationId}/reminders:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    post:
      operationId: remindInvitees
      tags: [invitations]
      summary: Remind open invitees
      description: |
        Host only. Sends `invite` again to everyone who has not answered; at most once per
        24 hours (`429` with `fields.retryAfter` in seconds).
      responses:
        "202":
          description: Number of reminded invitees.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResult"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/invitations/{invitationId}/response:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    put:
      operationId: respondToInvitation
      tags: [invitations]
      summary: Accept, decline or reset
      description: |
        Invitees only (`404` otherwise). `accepted` also marks the event as favorite;
        `declined` keeps an existing favorite; `open` resets the answer. The host gets
        `rsvp_yes` / `rsvp_no`. Not possible once the event has ended (`422`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationResponse"
      responses:
        "200":
          description: The invitation as the invitee sees it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedInvitation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/invitations:
    get:
      operationId: listReceivedInvitations
      tags: [invitations]
      summary: Received invitations
      description: Newest first.
      responses:
        "200":
          description: The received invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReceivedInvitation"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/me/invitations/{invitationId}:
    parameters:
      - $ref: "#/components/parameters/InvitationId"
    get:
      operationId: getReceivedInvitation
      tags: [invitations]
      summary: A received invitation
      description: Host, message, event, other invitees and the own status; `404` for non-invitees.
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedInvitation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/invitation-links/{token}:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    get:
      operationId: getInvitationLinkPreview
      tags: [invitations]
      summary: Preview of an invitation link
      description: |
        Host (first name + initial) and event, for signed-in users. `own` is true for the
        caller's own link. Counts towards the friend link limit (`429`).
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationLinkPreview"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/invitation-links/{token}/accept:
    parameters:
      - $ref: "#/components/parameters/InvitationToken"
    post:
      operationId: acceptInvitationLink
      tags: [invitations]
      summary: Accept an invitation link
      description: |
        Becomes friends with the host (if not yet) and an invitee with status `open`.
        Idempotent. The own link is `422 self_link`; past or cancelled events
        `422 event_not_invitable`.
      responses:
        "201":
          description: The received invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceivedInvitation"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/events:
    get:
      operationId: listModEvents
      tags: [moderation]
      summary: All events for maintenance
      description: |
        All events except deleted ones, with favorite count, source and version. Ordered:
        upcoming by start date, then past ones descending, then events without date. `ids`
        restricts the list; unknown IDs are silently dropped.
      parameters:
        - name: status
          in: query
          required: false
          description: Only events with this (derived) status.
          schema:
            $ref: "#/components/schemas/ModEventStatus"
        - name: q
          in: query
          required: false
          description: Search in name, place and city.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: ids
          in: query
          required: false
          description: Comma-separated event IDs.
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items:
              type: string
              format: uuid
      responses:
        "200":
          description: The events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModEventList"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createModEvent
      tags: [moderation]
      summary: Create an event
      description: Always creates a draft. Only the name is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModEventCreate"
      responses:
        "201":
          description: The created draft.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModEventDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/ModEventId"
    get:
      operationId: getModEvent
      tags: [moderation]
      summary: Event for editing
      description: All fields of an event, with `version` and `ETag`.
      responses:
        "200":
          description: All fields and the version.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModEventDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateModEvent
      tags: [moderation]
      summary: Edit an event
      description: |
        JSON merge patch: fields that are present are set (`null` clears them), the program is
        replaced as a whole. `If-Match` must carry the current version; otherwise `409
        version_conflict`. Cancelled events only accept text fields (`409
        invalid_transition`). Changes to a published event emit `event.updated`.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/ModEventPatch"
      responses:
        "200":
          description: The updated event.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModEventDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteModEvent
      tags: [moderation]
      summary: Delete an event
      description: |
        Soft delete from any status. Favorites of the event are removed in the background;
        users are not notified (cancel instead to inform them).
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/events/{eventId}/publish:
    parameters:
      - $ref: "#/components/parameters/ModEventId"
    post:
      operationId: publishModEvent
      tags: [moderation]
      summary: Publish a draft
      description: |
        Checks the required fields (`422 validation_failed` with `fields`). Only drafts (`409
        invalid_transition` otherwise).
      responses:
        "200":
          description: The published event.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModEventDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/events/{eventId}/unpublish:
    parameters:
      - $ref: "#/components/parameters/ModEventId"
    post:
      operationId: unpublishModEvent
      tags: [moderation]
      summary: Withdraw a published event (back to draft)
      description: Hides the event from users again; no notification. Only published events.
      responses:
        "200":
          description: The event as draft.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModEventDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/events/{eventId}/cancel:
    parameters:
      - $ref: "#/components/parameters/ModEventId"
    post:
      operationId: cancelModEvent
      tags: [moderation]
      summary: Cancel a published event
      description: Only published events. Users with this favorite get a notification (R11).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequest"
      responses:
        "200":
          description: The cancelled event.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModEventDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/ai-searches:
    get:
      operationId: listAiSearches
      tags: [moderation]
      summary: The caller's AI searches, newest first
      description: |
        At most the 20 newest searches of the calling moderator. `status=running` returns
        queued and running jobs; the app uses it to restore the status bar after a restart.
      parameters:
        - name: status
          in: query
          required: false
          description: Filter; `running` includes `queued`.
          schema:
            $ref: "#/components/schemas/AiSearchStatus"
      responses:
        "200":
          description: The searches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiSearch"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: startAiSearch
      tags: [moderation]
      summary: Start an AI search for events around a postal code (flow C)
      description: |
        Returns at once; a worker searches the web with an LLM and stores verified finds as
        drafts (`source = ai`). Any postal code known to the geocoder is allowed
        (`422 postal_code_unknown` otherwise, ADR 0015; `503 geocoding_unavailable` if the
        geocoder is down); finds outside the search radius are skipped. One running search
        per moderator (`409 search_running`, `fields.jobId` = the running job). Daily limit
        per moderator (`429 daily_limit`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSearchRequest"
      responses:
        "202":
          description: The search was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSearch"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/ai-searches/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        description: Job ID.
        schema:
          type: string
          format: uuid
    get:
      operationId: getAiSearch
      tags: [moderation]
      summary: Status and result of one AI search
      description: Only the caller's own searches (`404` otherwise). The app polls every 10 s (E-12).
      responses:
        "200":
          description: The search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSearch"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/categories:
    get:
      operationId: listModCategories
      tags: [moderation]
      summary: All categories for maintenance
      description: |
        All categories including inactive ones, in chip order, with the number of events
        (all statuses except deleted). Roles `moderator` or `category_admin`.
      responses:
        "200":
          description: The categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModCategory"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createModCategory
      tags: [moderation]
      summary: Create a category (appended at the end)
      description: |
        Role `category_admin`. Name 1–40 characters and unique ignoring case (`422` with
        `fields.name` = `required` / `duplicate`); emoji and color only from the presets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModCategoryCreate"
      responses:
        "201":
          description: The new category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModCategory"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/categories/order:
    put:
      operationId: orderModCategories
      tags: [moderation]
      summary: Set the chip order
      description: |
        Role `category_admin`. The complete list of category IDs in the new order (`422`
        if one is missing, unknown or repeated).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryOrderRequest"
      responses:
        "200":
          description: The categories in the new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModCategory"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/categories/{categoryId}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    patch:
      operationId: updateModCategory
      tags: [moderation]
      summary: Change a category
      description: |
        Role `category_admin`. Only the given fields change. Deactivated categories are no
        filter chip anymore and cannot be chosen for publishing; their events stay visible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModCategoryPatch"
      responses:
        "200":
          description: The changed category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModCategory"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteModCategory
      tags: [moderation]
      summary: Delete a category, moving its events
      description: |
        Role `category_admin`. If events use the category, `replacementId` is required
        (`422 replacement_required`); the events (including deleted ones) move and the
        category is deleted in one transaction. `replacementId` must be another existing
        category (`422 invalid_replacement`).
      parameters:
        - name: replacementId
          in: query
          required: false
          description: Category that takes over the events.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDeleted"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/geocode/reverse:
    get:
      operationId: reverseGeocodeEventLocation
      tags: [moderation]
      summary: Address of an event pin
      description: |
        Resolves the pin of an event to street, ZIP code and place (moderators only). Unlike
        `/v1/geocode/reverse` the coordinate is used in full precision: an event location is
        public data, not a user position. `street` is missing if no address is near the pin.
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude (WGS84).
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lon
          in: query
          required: true
          description: Longitude (WGS84).
          schema:
            type: number
            minimum: -180
            maximum: 180
      responses:
        "200":
          description: The place at the pin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReverseGeocodeResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/uploads:
    post:
      operationId: createModUpload
      tags: [moderation]
      summary: Request a signed upload URL for an image
      description: |
        Returns a pre-signed `PUT` URL into the object storage, valid for 10 minutes (only the
        key is signed; type and size are checked after the upload). The app uploads the file there directly with exactly the given
        headers, then attaches it with
        `POST /v1/mod/events/{eventId}/images`. Allowed are JPEG, PNG and WebP up to 10 MB
        (`422 validation_failed` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "201":
          description: The upload slot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/events/{eventId}/images:
    parameters:
      - $ref: "#/components/parameters/ModEventId"
    post:
      operationId: attachModEventImage
      tags: [moderation]
      summary: Attach an uploaded image to an event
      description: |
        Takes the uploaded file and starts processing in the background (metadata removal,
        variants). The image is appended unless `position` is given. At most 12 images per
        event (`422 too_many_images`). An unknown, foreign, used or not yet uploaded
        `uploadId` gives `422 invalid_upload`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachImageRequest"
      responses:
        "201":
          description: The image, still processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModImage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/events/{eventId}/images/order:
    parameters:
      - $ref: "#/components/parameters/ModEventId"
    put:
      operationId: orderModEventImages
      tags: [moderation]
      summary: Set the order of the images
      description: |
        The complete list of the event's image IDs in the new order; the first one is the
        cover image. A missing, unknown or repeated ID gives `422 validation_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageOrderRequest"
      responses:
        "200":
          description: The images in the new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModImage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/events/{eventId}/images/{imageId}:
    parameters:
      - $ref: "#/components/parameters/ModEventId"
      - $ref: "#/components/parameters/ImageId"
    delete:
      operationId: deleteModEventImage
      tags: [moderation]
      summary: Remove an image
      description: Removes the image at once; its files are deleted in the background.
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
  /v1/mod/events/{eventId}/images/{imageId}/retry:
    parameters:
      - $ref: "#/components/parameters/ModEventId"
      - $ref: "#/components/parameters/ImageId"
    post:
      operationId: retryModEventImage
      tags: [moderation]
      summary: Process a failed image again
      description: Only images with status `failed` whose upload still exists (`409 not_retryable` otherwise).
      responses:
        "202":
          description: The image, processing again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModImage"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
components:
  headers:
    ETag:
      description: Current version of the event, quoted (e.g. `"3"`); send it as `If-Match`.
      schema:
        type: string
  parameters:
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Invitation ID.
      schema:
        type: string
        format: uuid
    InvitationToken:
      name: token
      in: path
      required: true
      description: Invitation link token (128 random bits, base64url).
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{22}$"
    ListId:
      name: listId
      in: path
      required: true
      description: Shared list ID.
      schema:
        type: string
        format: uuid
    FriendToken:
      name: token
      in: path
      required: true
      description: Friend link token (128 random bits, base64url, no personal data).
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{22}$"
    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Category ID.
      schema:
        type: string
        format: uuid
    ImageId:
      name: imageId
      in: path
      required: true
      description: Image ID.
      schema:
        type: string
        format: uuid
    ModEventId:
      name: eventId
      in: path
      required: true
      description: Event ID.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Version from `ETag` / `version` (quoted or plain). Missing → `428`.
      schema:
        type: string
        minLength: 1
        maxLength: 20
    Bbox:
      name: bbox
      in: query
      required: false
      description: Map viewport `minLon,minLat,maxLon,maxLat`.
      style: form
      explode: false
      schema:
        type: array
        minItems: 4
        maxItems: 4
        items:
          type: number
    Lat:
      name: lat
      in: query
      required: false
      description: Latitude of the reference point (user position or map center). Requires `lon`.
      schema:
        type: number
        minimum: -90
        maximum: 90
    Lon:
      name: lon
      in: query
      required: false
      description: Longitude of the reference point. Requires `lat`.
      schema:
        type: number
        minimum: -180
        maximum: 180
    RadiusKm:
      name: radiusKm
      in: query
      required: false
      description: Radius around `lat`/`lon` in km. Ignored without `lat`/`lon`.
      schema:
        type: integer
        minimum: 10
        maximum: 300
        default: 150
    When:
      name: when
      in: query
      required: false
      description: |
        Time filter: `today` = running today; `weekend` = overlaps Saturday or Sunday of the
        current week; `months` = overlaps at least one month in `months`.
      schema:
        type: string
        enum: [all, today, weekend, months]
        default: all
    Months:
      name: months
      in: query
      required: false
      description: Months `YYYY-MM` (required for `when=months`, at most 12).
      style: form
      explode: false
      schema:
        type: array
        minItems: 1
        maxItems: 12
        items:
          type: string
          pattern: "^20[0-9]{2}-(0[1-9]|1[0-2])$"
    Categories:
      name: categories
      in: query
      required: false
      description: Category IDs. Unknown or inactive IDs are ignored silently.
      style: form
      explode: false
      schema:
        type: array
        maxItems: 50
        items:
          type: string
          format: uuid
    Query:
      name: q
      in: query
      required: false
      description: Text search in name, place and city (case/accent-insensitive, typo-tolerant).
      schema:
        type: string
        minLength: 2
        maxLength: 100
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the IdP (Zitadel in production, Keycloak locally).
  responses:
    Error:
      description: Error in the common error format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Category:
      type: object
      description: Event category (filter chip, marker border color).
      required: [id, name, emoji, color, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          examples: [Stadtfest]
        emoji:
          type: string
          examples: ["🎪"]
        color:
          type: string
          pattern: "^#[0-9A-F]{6}$"
          examples: ["#FFB547"]
        sortOrder:
          type: integer
          minimum: 0
    CategoryEmoji:
      type: string
      description: One of the 12 preset emojis (design reference §14).
      enum: ["🎪", "🎡", "🎄", "🐎", "🍺", "🍷", "🎭", "🎶", "🏰", "🎃", "🌸", "🔥"]
    CategoryColor:
      type: string
      description: One of the 6 preset colors (theme-farben.md).
      enum: ["#FFB547", "#FF6B8B", "#5EEAD4", "#8B9CFF", "#7ED957", "#C792EA"]
    AiSearchStatus:
      type: string
      enum: [queued, running, completed, failed]
    AiSearchRequest:
      type: object
      required: [postalCode]
      properties:
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
    AiSearchSkipped:
      type: object
      description: Finds that were not stored, by reason (counts only, no content).
      required: [duplicate, outOfArea, invalid, unverifiedSource]
      properties:
        duplicate:
          type: integer
          minimum: 0
        outOfArea:
          type: integer
          minimum: 0
          description: Outside the search radius around the postal code, or no location.
        invalid:
          type: integer
          minimum: 0
        unverifiedSource:
          type: integer
          minimum: 0
    AiSearch:
      type: object
      description: An AI search job (R10).
      required: [id, postalCode, placeName, status, createdAt, newEventIds, skipped]
      properties:
        id:
          type: string
          format: uuid
        postalCode:
          type: string
        placeName:
          type: string
        status:
          $ref: "#/components/schemas/AiSearchStatus"
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        newEventIds:
          type: array
          items:
            type: string
            format: uuid
        skipped:
          $ref: "#/components/schemas/AiSearchSkipped"
        errorCode:
          type: ["string", "null"]
          enum: [llm_unavailable, search_unavailable, timeout, internal, null]
    ModCategory:
      type: object
      description: Category in the moderation view, including inactive ones.
      required: [id, name, emoji, color, active, sortOrder, eventCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emoji:
          type: string
        color:
          type: string
          pattern: "^#[0-9A-F]{6}$"
        active:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
        eventCount:
          type: integer
          minimum: 0
          description: Events of all statuses except deleted.
    ModCategoryCreate:
      type: object
      required: [name, emoji, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        emoji:
          $ref: "#/components/schemas/CategoryEmoji"
        color:
          $ref: "#/components/schemas/CategoryColor"
        active:
          type: boolean
          default: true
    ModCategoryPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        emoji:
          $ref: "#/components/schemas/CategoryEmoji"
        color:
          $ref: "#/components/schemas/CategoryColor"
        active:
          type: boolean
    CategoryOrderRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
    CategoryDeleted:
      type: object
      required: [movedEvents]
      properties:
        movedEvents:
          type: integer
          minimum: 0
          description: Events moved to the replacement category.
        replacementId:
          type: ["string", "null"]
          format: uuid
    CategoryRef:
      type: object
      description: Category as embedded in an event detail.
      required: [id, name, emoji, color]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        emoji:
          type: string
        color:
          type: string
          pattern: "^#[0-9A-F]{6}$"
    PublicEventStatus:
      type: string
      description: Status of a publicly visible event. "Past" is derived from `endDate`.
      enum: [published, cancelled]
    Image:
      type: object
      description: |
        Event image variants (R08), WebP with immutable URLs: `url` (long edge 1,600 px),
        `cardUrl` (600 px), `thumbUrl` (200 px). `jpegUrl` is the full size as JPEG, e.g. for
        link previews.
      required: [url, thumbUrl]
      properties:
        url:
          type: string
          format: uri
        cardUrl:
          type: string
          format: uri
        thumbUrl:
          type: string
          format: uri
        jpegUrl:
          type: string
          format: uri
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
    EventSummary:
      type: object
      description: Event as shown in carousel, list and timeline.
      required: [id, name, shortName, status, startDate, endDate, place, city, lat, lon, categoryId]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: string
          description: Short name for the selected map pin.
        status:
          $ref: "#/components/schemas/PublicEventStatus"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        place:
          type: string
        city:
          type: string
        lat:
          type: number
        lon:
          type: number
        categoryId:
          type: string
          format: uuid
        distanceKm:
          type: ["number", "null"]
          description: Distance to the reference point, if one was given.
        coverImage:
          oneOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"
    EventPage:
      type: object
      description: One page of events.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        nextCursor:
          type: ["string", "null"]
          description: Cursor for the next page, `null` on the last page.
    EventCount:
      type: object
      description: Result counts for filter previews.
      required: [total, byCategory]
      properties:
        total:
          type: integer
          minimum: 0
        byCategory:
          type: object
          description: Category ID -> number of events matching all filters except categories.
          additionalProperties:
            type: integer
            minimum: 0
    ProgramItem:
      type: object
      description: Entry of the event program.
      required: [date, timeLabel, title]
      properties:
        date:
          type: string
          format: date
        timeLabel:
          type: string
          examples: ["10:45 Uhr"]
        title:
          type: string
        subtitle:
          type: ["string", "null"]
    EventDetail:
      type: object
      description: Full public event detail.
      required:
        [id, name, shortName, status, category, startDate, endDate, openingHours, place, address,
         city, postalCode, lat, lon, program, images]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: string
        status:
          $ref: "#/components/schemas/PublicEventStatus"
        cancelReason:
          type: ["string", "null"]
        category:
          $ref: "#/components/schemas/CategoryRef"
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        openingHours:
          type: array
          items:
            type: string
        price:
          type: ["string", "null"]
        place:
          type: string
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
        lat:
          type: number
        lon:
          type: number
        description:
          type: ["string", "null"]
        program:
          type: array
          items:
            $ref: "#/components/schemas/ProgramItem"
        transit:
          type: ["string", "null"]
        parking:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
          format: uri
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        distanceKm:
          type: ["number", "null"]
        isFavorite:
          type: boolean
          description: Whether the caller marked the event as favorite. Only present with a token.
        invitationSummary:
          description: |
            With a token (R14-US6): as host the invitees who accepted, as accepted invitee the
            host and the other accepted invitees; otherwise null or missing.
          oneOf:
            - $ref: "#/components/schemas/InvitationSummary"
            - type: "null"
    FavoriteEntry:
      description: A favorite with its event, as shown in the timeline (R06-US2).
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          required: [categoryName, emoji, favoritedAt]
          properties:
            categoryName:
              type: string
            emoji:
              type: string
            favoritedAt:
              type: string
              format: date-time
    FavoriteList:
      type: object
      description: Favorites of the caller, ordered by start date.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FavoriteEntry"
    ModEventStatus:
      type: string
      description: |
        Status in the moderation view. `past` is derived for published events whose end date
        is before today (Europe/Berlin).
      enum: [draft, published, past, cancelled]
    EventSource:
      type: string
      description: "`manual` or found by the AI search (`ai`, R10)."
      enum: [manual, ai]
    ModEventSummary:
      type: object
      description: Row of the moderation overview.
      required: [id, name, status, place, city, favoriteCount, source, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: "#/components/schemas/ModEventStatus"
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        place:
          type: string
        city:
          type: string
        categoryId:
          type: ["string", "null"]
          format: uuid
        favoriteCount:
          type: integer
          minimum: 0
        source:
          $ref: "#/components/schemas/EventSource"
        version:
          type: integer
          minimum: 1
    ModEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModEventSummary"
    ModProgramItem:
      type: object
      description: Program entry as entered by the moderator.
      required: [date, timeLabel, title]
      properties:
        date:
          type: string
          format: date
        timeLabel:
          type: string
          maxLength: 40
        title:
          type: string
          minLength: 1
          maxLength: 120
        subtitle:
          type: ["string", "null"]
          maxLength: 200
    ModEventDetail:
      type: object
      description: Event with all editable fields; fields of drafts may be empty.
      required:
        [id, name, shortName, status, openingHours, place, address, city, program,
         favoriteCount, source, version, images]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortName:
          type: string
        status:
          $ref: "#/components/schemas/ModEventStatus"
        categoryId:
          type: ["string", "null"]
          format: uuid
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        openingHours:
          type: array
          items:
            type: string
        price:
          type: ["string", "null"]
        place:
          type: string
        address:
          type: string
        city:
          type: string
        postalCode:
          type: ["string", "null"]
        lat:
          type: ["number", "null"]
        lon:
          type: ["number", "null"]
        description:
          type: ["string", "null"]
        program:
          type: array
          items:
            $ref: "#/components/schemas/ModProgramItem"
        transit:
          type: ["string", "null"]
        parking:
          type: ["string", "null"]
        websiteUrl:
          type: ["string", "null"]
        cancelReason:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
          format: date-time
        favoriteCount:
          type: integer
          minimum: 0
        source:
          $ref: "#/components/schemas/EventSource"
        sourceUrl:
          type: ["string", "null"]
          description: Page an AI find came from (R10).
        foundAt:
          type: ["string", "null"]
          format: date-time
        aiJobId:
          type: ["string", "null"]
          format: uuid
        version:
          type: integer
          minimum: 1
        images:
          type: array
          description: All images in order, including processing and failed ones (R08).
          items:
            $ref: "#/components/schemas/ModImage"
    ModImageStatus:
      type: string
      enum: [processing, ready, failed]
    ModImage:
      type: object
      description: An event image in the moderation view. Variants only when `ready`.
      required: [id, status, position, image]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/ModImageStatus"
        position:
          type: integer
          minimum: 0
          description: 0 is the cover image.
        image:
          description: Variants; `null` until the image is ready.
          oneOf:
            - $ref: "#/components/schemas/Image"
            - type: "null"
    UploadContentType:
      type: string
      enum: [image/jpeg, image/png, image/webp]
    UploadRequest:
      type: object
      required: [contentType, sizeBytes]
      properties:
        contentType:
          $ref: "#/components/schemas/UploadContentType"
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
          description: Exact file size; attaching the upload fails if the stored file differs.
    Upload:
      type: object
      required: [uploadId, url, method, headers, expiresAt]
      properties:
        uploadId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          description: Headers the upload request must send unchanged.
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    AttachImageRequest:
      type: object
      required: [uploadId]
      properties:
        uploadId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
          maximum: 11
          description: Insert position; appended if missing.
    ImageOrderRequest:
      type: object
      required: [imageIds]
      properties:
        imageIds:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            format: uuid
    ModEventFields:
      type: object
      description: |
        Editable fields. Lengths: name 120, short name 18, description 5,000, 10 opening hour
        lines of 80, 50 program entries. Postal code and city come from geocoding.
      properties:
        shortName:
          type: ["string", "null"]
          maxLength: 18
          description: Defaults to the name shortened to 18 characters.
        categoryId:
          type: ["string", "null"]
          format: uuid
        startDate:
          type: ["string", "null"]
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        openingHours:
          type: ["array", "null"]
          maxItems: 10
          items:
            type: string
            maxLength: 80
        price:
          type: ["string", "null"]
          maxLength: 200
        place:
          type: ["string", "null"]
          maxLength: 120
        address:
          type: ["string", "null"]
          maxLength: 200
        city:
          type: ["string", "null"]
          maxLength: 120
        postalCode:
          type: ["string", "null"]
          pattern: "^[0-9]{5}$"
        lat:
          type: ["number", "null"]
          minimum: -90
          maximum: 90
        lon:
          type: ["number", "null"]
          minimum: -180
          maximum: 180
        description:
          type: ["string", "null"]
          maxLength: 5000
        program:
          type: ["array", "null"]
          maxItems: 50
          items:
            $ref: "#/components/schemas/ModProgramItem"
        transit:
          type: ["string", "null"]
          maxLength: 500
        parking:
          type: ["string", "null"]
          maxLength: 500
        websiteUrl:
          type: ["string", "null"]
          maxLength: 500
        cancelReason:
          type: ["string", "null"]
          maxLength: 500
    ModEventCreate:
      description: New draft; only the name is required.
      allOf:
        - $ref: "#/components/schemas/ModEventFields"
        - type: object
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    ModEventPatch:
      description: Merge patch of an event; all fields optional.
      allOf:
        - $ref: "#/components/schemas/ModEventFields"
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 120
    CancelRequest:
      type: object
      properties:
        reason:
          type: ["string", "null"]
          maxLength: 500
          description: Shown in the cancellation notice (R11).
    GeocodeResult:
      type: object
      description: A geocoding suggestion.
      required: [label, city, lat, lon, kind]
      properties:
        label:
          type: string
          examples: ["73430 Aalen"]
        postalCode:
          type: ["string", "null"]
          pattern: "^[0-9]{5}$"
        city:
          type: string
        lat:
          type: number
        lon:
          type: number
        kind:
          type: string
          enum: [postcode, city, address]
    ReverseGeocodeResult:
      type: object
      description: Place for coordinates.
      required: [city, label]
      properties:
        street:
          type: ["string", "null"]
          description: Street and house number; only `/v1/mod/geocode/reverse` fills it.
        postalCode:
          type: ["string", "null"]
          pattern: "^[0-9]{5}$"
        city:
          type: string
        label:
          type: string
    Me:
      type: object
      description: Profile of the signed-in user. Contains no email address (E-08).
      required: [id, firstName, lastName, roles]
      properties:
        id:
          type: string
          format: uuid
          description: Internal user ID (not the IdP subject).
        firstName:
          type: string
          maxLength: 50
          description: Empty if the IdP did not provide a name (e.g. Apple without name sharing).
        lastName:
          type: string
          maxLength: 50
        roles:
          type: array
          description: Effective roles from the token.
          items:
            $ref: "#/components/schemas/Role"
    Role:
      type: string
      enum: [user, moderator, category_admin]
    UpdateMeRequest:
      type: object
      required: [firstName, lastName]
      additionalProperties: false
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
        lastName:
          type: string
          minLength: 1
          maxLength: 50
    AppConfig:
      type: object
      description: Public app configuration.
      required: [pushProvider]
      properties:
        pushProvider:
          $ref: "#/components/schemas/PushProvider"
    PushProvider:
      type: string
      description: Push delivery (`PUSH_PROVIDER`); decides the token type the app registers.
      enum: [expo, direct, disabled]
    NotificationType:
      type: string
      description: |
        `remind`: a favorite starts soon; `near`: new event near the home; `change`: date,
        times or place of a favorite changed; `cancel`: a favorite was cancelled;
        `friend_added`: someone accepted the caller's friend link (R12, list only, no push);
        `list_added`: someone added the caller to a shared list (R13, pushed if `invite`);
        `invite`: a friend invites the caller to an event (R14, `invite`); `rsvp_yes` /
        `rsvp_no`: an invitee of the caller accepted / declined (R14, `rsvp`).
        Extensible (ADR 0017): new values may appear without a new API version; clients must
        show unknown types with a neutral fallback.
      enum: [remind, near, change, cancel, friend_added, list_added, invite, rsvp_yes, rsvp_no]
    NotificationTarget:
      type: object
      description: |
        What a tap opens; `friend` opens the friends list (id = the friend's user ID), `list`
        a shared list, `invitation` a received invitation (id = invitation ID),
        `invitationOverview` the caller's own invitation to an event (id = event ID). The type
        is extensible (ADR 0017): unknown types open nothing.
      required: [type, id]
      properties:
        type:
          type: string
          enum: [event, friend, list, invitation, invitationOverview]
        id:
          type: string
          format: uuid
    Notification:
      type: object
      required: [id, type, text, target, read, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/NotificationType"
        text:
          type: string
          description: German text, rendered when reading.
        target:
          $ref: "#/components/schemas/NotificationTarget"
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NotificationPage:
      type: object
      description: One page of notifications, newest first.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: ["string", "null"]
          description: Cursor for the next page, `null` on the last page.
    RemindDaysBefore:
      type: integer
      enum: [1, 3, 7]
    NearRadiusKm:
      type: integer
      minimum: 5
      maximum: 150
      multipleOf: 5
    HomeUpdate:
      type: object
      required: [postalCode, placeName]
      additionalProperties: false
      properties:
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
        placeName:
          type: string
          minLength: 1
          maxLength: 100
    Home:
      type: object
      description: Home for "new near your home"; the location is the ZIP code center.
      required: [postalCode, placeName, lat, lon]
      properties:
        postalCode:
          type: string
          pattern: "^[0-9]{5}$"
        placeName:
          type: string
        lat:
          type: number
          description: Latitude of the ZIP code center (for the radius preview).
        lon:
          type: number
    NotificationSettingsUpdate:
      type: object
      required: [remind, remindDaysBefore, near, home, nearRadiusKm, change, invite, rsvp]
      additionalProperties: false
      properties:
        remind:
          type: boolean
        remindDaysBefore:
          $ref: "#/components/schemas/RemindDaysBefore"
        near:
          type: boolean
        home:
          oneOf:
            - $ref: "#/components/schemas/HomeUpdate"
            - type: "null"
        nearRadiusKm:
          $ref: "#/components/schemas/NearRadiusKm"
        change:
          type: boolean
        invite:
          type: boolean
        rsvp:
          type: boolean
    NotificationSettings:
      type: object
      description: |
        Which types are pushed. Muted types still appear in the list. `invite` and `rsvp`
        take effect with invitations (R14).
      required: [remind, remindDaysBefore, near, home, nearRadiusKm, change, invite, rsvp]
      properties:
        remind:
          type: boolean
        remindDaysBefore:
          $ref: "#/components/schemas/RemindDaysBefore"
        near:
          type: boolean
        home:
          oneOf:
            - $ref: "#/components/schemas/Home"
            - type: "null"
        nearRadiusKm:
          $ref: "#/components/schemas/NearRadiusKm"
        change:
          type: boolean
        invite:
          type: boolean
        rsvp:
          type: boolean
    DevicePlatform:
      type: string
      enum: [ios, android]
    DeviceRegistration:
      type: object
      required: [token, platform, provider]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Expo push token (`expo`) or native APNs/FCM token (`direct`).
        platform:
          $ref: "#/components/schemas/DevicePlatform"
        provider:
          type: string
          enum: [expo, direct]
    FriendLink:
      type: object
      description: The caller's personal friend link (the token alone grants befriending).
      required: [token, createdAt]
      properties:
        token:
          type: string
          pattern: "^[A-Za-z0-9_-]{22}$"
        createdAt:
          type: string
          format: date-time
    FriendLinkOwner:
      type: object
      required: [owner]
      properties:
        owner:
          type: object
          description: Only first name and last-name initial (privacy, R12).
          required: [firstName, lastNameInitial]
          properties:
            firstName:
              type: string
            lastNameInitial:
              type: string
              maxLength: 1
    Friend:
      type: object
      required: [id, firstName, lastName, since]
      properties:
        id:
          type: string
          format: uuid
          description: User ID of the friend.
        firstName:
          type: string
        lastName:
          type: string
        since:
          type: string
          format: date-time
    FriendList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Friend"
    ListMember:
      type: object
      description: A member as the other members see them (name for joint planning).
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
    ListEvent:
      description: An event of a shared list.
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          required: [categoryName, emoji, addedAt]
          properties:
            categoryName:
              type: string
            emoji:
              type: string
            addedAt:
              type: string
              format: date-time
    SharedListSummary:
      type: object
      required: [id, name, eventCount, members]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        eventCount:
          type: integer
          minimum: 0
        members:
          type: array
          items:
            $ref: "#/components/schemas/ListMember"
        nextEvent:
          description: The next event that has not ended, if any.
          oneOf:
            - $ref: "#/components/schemas/ListEvent"
            - type: "null"
    SharedList:
      type: object
      required: [id, name, members, events]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/ListMember"
        events:
          type: array
          description: Chronological, including past and cancelled events.
          items:
            $ref: "#/components/schemas/ListEvent"
    SharedListName:
      type: string
      minLength: 1
      maxLength: 60
    SharedListCreate:
      type: object
      required: [name, memberIds]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/SharedListName"
        memberIds:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
    SharedListRename:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/SharedListName"
    SharedListMemberAdd:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          type: string
          format: uuid
    InvitationPerson:
      type: object
      required: [id, firstName, lastName]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
    InviteeStatus:
      type: string
      enum: [open, accepted, declined]
    Invitee:
      type: object
      required: [person, status, invitedAt]
      properties:
        person:
          $ref: "#/components/schemas/InvitationPerson"
        status:
          $ref: "#/components/schemas/InviteeStatus"
        invitedAt:
          type: string
          format: date-time
        respondedAt:
          type: ["string", "null"]
          format: date-time
    InvitationMessage:
      type: string
      maxLength: 280
    HostInvitation:
      type: object
      description: The caller's invitation as host.
      required: [id, event, invitees]
      properties:
        id:
          type: string
          format: uuid
        event:
          $ref: "#/components/schemas/EventSummary"
        message:
          type: ["string", "null"]
        invitees:
          type: array
          items:
            $ref: "#/components/schemas/Invitee"
        lastReminderAt:
          type: ["string", "null"]
          format: date-time
    ReceivedInvitation:
      type: object
      description: An invitation the caller received.
      required: [id, event, host, createdAt, status, others]
      properties:
        id:
          type: string
          format: uuid
        event:
          $ref: "#/components/schemas/EventSummary"
        host:
          $ref: "#/components/schemas/InvitationPerson"
        message:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/InviteeStatus"
        others:
          type: array
          description: The other invitees with their status.
          items:
            $ref: "#/components/schemas/Invitee"
    InviteRequest:
      type: object
      required: [userIds]
      additionalProperties: false
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        message:
          $ref: "#/components/schemas/InvitationMessage"
    InvitationLink:
      type: object
      required: [token]
      properties:
        token:
          type: string
          pattern: "^[A-Za-z0-9_-]{22}$"
    ReminderResult:
      type: object
      required: [reminded]
      properties:
        reminded:
          type: integer
          minimum: 0
    InvitationResponse:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          $ref: "#/components/schemas/InviteeStatus"
    InvitationLinkPreview:
      type: object
      required: [host, event, own]
      properties:
        host:
          type: object
          required: [firstName, lastNameInitial]
          properties:
            firstName:
              type: string
            lastNameInitial:
              type: string
              maxLength: 1
        event:
          $ref: "#/components/schemas/EventSummary"
        own:
          type: boolean
          description: The caller is the host (the app opens the own overview).
    InvitationSummary:
      type: object
      required: [invitationId, role, people]
      properties:
        invitationId:
          type: string
          format: uuid
        role:
          type: string
          enum: [host, guest]
        people:
          type: array
          description: Who comes along (accepted invitees, for guests also the host).
          items:
            $ref: "#/components/schemas/InvitationPerson"
    Error:
      type: object
      description: Common error format for all non-2xx responses.
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code, e.g. `validation_failed`, `not_found`.
          examples: [validation_failed]
        message:
          type: string
          description: Human-readable message (German, suitable for display).
          examples: [Bitte fülle die markierten Pflichtfelder aus]
        fields:
          type: object
          description: Field-level errors keyed by field name.
          additionalProperties:
            type: string
    HealthStatus:
      type: object
      description: Result of the liveness probe.
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessStatus:
      type: object
      description: Result of the readiness probe with one entry per dependency.
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          description: Status per dependency, e.g. `database`, `redis`.
          additionalProperties:
            type: string
            enum: [ok, unavailable]
security:
  - bearerAuth: []
